name: Windows

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Configure
        run: cmake -S . -B build-cmake -A x64

      - name: Build
        run: cmake --build build-cmake --config Release --parallel

      - name: Test
        run: ctest --test-dir build-cmake -C Release --output-on-failure

      - name: Install
        run: cmake --install build-cmake --config Release --prefix dist

      - uses: actions/upload-artifact@v4
        with:
          name: gdscript-lsp-windows-x64
          path: dist
          if-no-files-found: error
